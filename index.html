<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mystery Song Player</title>
<style>
  :root { --c1: #ff007f; --c2: #2b1055; --fg: #fff; }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: linear-gradient(160deg, var(--c2), var(--c1));
    color: var(--fg); margin: 0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 20px;
  }
  .screen { display: none; width: 100%; max-width: 480px; }
  .screen.on { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  h1 { font-size: 2.4rem; margin: 0; text-shadow: 0 2px 8px rgba(0,0,0,.4); }
  p { margin: 0; font-size: 1.1rem; opacity: .9; }
  .btn {
    background: var(--fg); color: var(--c2); font-size: 1.4rem; font-weight: 800;
    padding: 18px 40px; border: none; border-radius: 50px; cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,.35); letter-spacing: 1px;
  }
  .btn:active { transform: scale(.95); }
  .btn.sm { font-size: 1rem; padding: 12px 22px; background: rgba(128,128,128,.25); color: var(--fg); box-shadow: none; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #finder { position: relative; width: 100%; max-width: 480px; aspect-ratio: 3/4; border-radius: 16px; overflow: hidden; background: #000; }
  #video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #guide { position: absolute; left: 15%; top: 50%; width: 70%; aspect-ratio: 1; transform: translateY(-50%);
           border: 3px solid rgba(255,255,255,.8); border-radius: 12px; box-shadow: 0 0 0 999px rgba(0,0,0,.35); }
  #canvas { display: none; }
  .bar { width: 100%; height: 10px; background: rgba(255,255,255,.25); border-radius: 5px; overflow: hidden; }
  .bar div { height: 100%; width: 0; background: var(--fg); transition: width .25s linear; }
  .big { font-size: 5rem; line-height: 1; }
  #reveal { background: rgba(0,0,0,.35); border-radius: 16px; padding: 16px; width: 100%; display: none; }
  #reveal img { width: 120px; border-radius: 10px; }
  #status { min-height: 1.4em; }
  .err { color: #ffd6d6; }
</style>
</head>
<body>

<div class="screen on" id="home">
  <img id="brandLogo" alt="" style="display:none;max-width:220px;max-height:220px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.3))">
  <h1 id="brandName">TuneFlip</h1>
  <p>Mystery song player</p>
  <button class="btn" id="startBtn" onclick="startScan()">SCAN A CARD</button>
  <button class="btn" id="playBtn" onclick="playCurrent()" style="display:none">&#9654; PLAY SONG</button>
  <p id="homeHint" style="font-size:.9rem">Scanning uses your camera. Point it at the QR on the back of a card.</p>
  <p style="margin-top:30px;font-size:.85rem;opacity:.7"><a href="build.html" style="color:var(--fg)">Build your own deck &rarr;</a></p>
</div>

<div class="screen" id="scan">
  <p>Point at the QR code&hellip;</p>
  <div id="finder"><video id="video" playsinline muted autoplay></video><div id="guide"></div></div>
  <canvas id="canvas"></canvas>
  <p id="scanStatus" style="font-size:.85rem;opacity:.8">Starting camera…</p>
  <button class="btn sm" onclick="stopScan(); show('home')">Cancel</button>
</div>

<div class="screen" id="play">
  <div class="big">&#127911;</div>
  <h1>Listen &amp; guess!</h1>
  <p id="status"></p>
  <div class="bar"><div id="prog"></div></div>
  <div class="row">
    <button class="btn sm" id="pauseBtn" onclick="togglePause()">&#10074;&#10074; Pause</button>
    <button class="btn sm" onclick="replay()">&#8635; Replay</button>
    <button class="btn sm" onclick="toggleReveal()">&#128064; Reveal</button>
  </div>
  <button class="btn" onclick="startScan()">SCAN NEXT</button>
  <div id="reveal"></div>
</div>

<audio id="audio" preload="auto"></audio>

<script src="lib/jsQR.js"></script>
<script>
// ---------- branding (from ?name=&c1=&c2= on the deck's app card, remembered per phone) ----------
const DEFAULT_BRAND = { name: 'TuneFlip', c1: '#ff007f', c2: '#2b1055' };
function loadBrand() {
  let b = { ...DEFAULT_BRAND };
  try { Object.assign(b, JSON.parse(localStorage.getItem('brand') || '{}')); } catch (e) {}
  const q = new URLSearchParams(location.search);
  if (q.get('name')) { b.name = q.get('name'); b.logo = q.get('logo') || ''; }   // a deck without a logo clears an old one
  if (/^[0-9a-f]{6}$/i.test(q.get('c1') || '')) b.c1 = '#' + q.get('c1');
  if (/^[0-9a-f]{6}$/i.test(q.get('c2') || '')) b.c2 = '#' + q.get('c2');
  try { localStorage.setItem('brand', JSON.stringify(b)); } catch (e) {}
  return b;
}
const brand = loadBrand();
document.documentElement.style.setProperty('--c1', brand.c1);
document.documentElement.style.setProperty('--c2', brand.c2);
document.getElementById('brandName').textContent = brand.name;
document.title = brand.name;
if (brand.logo) {
  const img = document.getElementById('brandLogo');
  img.onload = () => { img.style.display = ''; document.getElementById('brandName').style.display = 'none'; };
  img.src = new URL(brand.logo, location.href).href;
}

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const audio = $('audio'), video = $('video'), canvas = $('canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });
let stream = null, current = null, lastCode = '', lastCodeAt = 0;

function show(id) { document.querySelectorAll('.screen').forEach(e => e.classList.toggle('on', e.id === id)); }

// A card QR is "<app url>#t=<itunes track id>&y=<year>". Accept the bare "t=..." too.
function parseCode(s) {
  const t = s.match(/[#?&]t=(\d+)/) || s.match(/^t=(\d+)/);
  if (!t) return null;
  const y = s.match(/[#?&]y=(\d{4})/);
  const c = s.match(/[?&]c=([0-9a-f]{6})\b/i);
  return { id: t[1], year: y ? y[1] : null, colour: c ? '#' + c[1] : null };
}
// Random-colour decks put the card's colour in the QR; tint the page to match.
function luminance(hex) {
  const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255).map(v => v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4);
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
function shade(hex, k) { return '#' + [1, 3, 5].map(i => Math.round(parseInt(hex.slice(i, i + 2), 16) * k).toString(16).padStart(2, '0')).join(''); }
function tint(colour) {
  const st = document.documentElement.style;
  if (!colour) { st.setProperty('--c1', brand.c1); st.setProperty('--c2', brand.c2); st.setProperty('--fg', '#fff'); return; }
  const light = luminance(colour) > 0.3;
  st.setProperty('--c2', colour); st.setProperty('--c1', shade(colour, light ? 0.85 : 1.35)); st.setProperty('--fg', light ? '#1a1a2e' : '#fff');
}

// iTunes lookup via JSONP (the API doesn't send CORS headers, but supports callback=)
function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cb = 'cb' + Date.now() + Math.floor(Math.random() * 1e6);
    const s = document.createElement('script');
    const done = () => { delete window[cb]; s.remove(); clearTimeout(timer); };
    const timer = setTimeout(() => { done(); reject(new Error('Lookup timed out')); }, 10000);
    window[cb] = d => { done(); resolve(d); };
    s.onerror = () => { done(); reject(new Error('Lookup failed')); };
    s.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
    document.head.appendChild(s);
  });
}

// iOS only allows audio.play() after a tap. Play a silent clip on the first tap; after that
// swapping src + play() works without another gesture.
let unlocked = false;
function unlock() {
  if (unlocked) return;
  unlocked = true;
  audio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
  audio.play().catch(() => {});
}

// ---------- scanning ----------
async function startScan() {
  unlock();
  audio.pause();                                       // scanning the next card ends the current song
  show('scan');
  $('scanStatus').textContent = 'Starting camera…';
  try {
    // Keep one stream for the whole session: stopping and re-requesting makes iOS ask permission every time.
    if (stream && stream.getVideoTracks().some(t => t.readyState === 'live')) {
      stream.getVideoTracks().forEach(t => { t.enabled = true; });
    } else {
      // iOS hands out 640x480 unless asked; a dense QR needs more pixels than that
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
      video.srcObject = stream;
    }
    scanning = true;
    await video.play();
  } catch (e) {
    show('home');
    $('homeHint').innerHTML = '<span class="err">Camera not available: ' + e.name + ' ' + e.message + '</span>';
    return;
  }
  frames = 0;
  requestAnimationFrame(tick);
}
let frames = 0;
let scanning = false;
// Pause scanning but keep the camera permission: mute the track and stop pulling frames.
function stopScan() {
  scanning = false;
  if (stream) stream.getVideoTracks().forEach(t => { t.enabled = false; });
  video.pause();
}
function tick() {
  if (!scanning || !stream) return;
  try {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (vw && vh) {
      // Decode only the centre square (the guide box) at full resolution: best detail, fewer pixels for jsQR
      const side = Math.round(Math.min(vw, vh) * 0.7), sx = (vw - side) >> 1, sy = (vh - side) >> 1;
      const out = Math.min(side, 800);
      canvas.width = out; canvas.height = out;
      ctx.drawImage(video, sx, sy, side, side, 0, 0, out, out);
      const img = ctx.getImageData(0, 0, out, out);
      const code = jsQR(img.data, out, out, { inversionAttempts: 'dontInvert' });
      frames++;
      if (frames % 10 === 1) $('scanStatus').textContent = 'Camera ' + vw + '\u00d7' + vh + ' \u00b7 hold the QR in the box';
      if (code && code.data) {
        const now = Date.now();
        if (code.data !== lastCode || now - lastCodeAt > 3000) {
          lastCode = code.data; lastCodeAt = now;
          const t = parseCode(code.data);
          if (t) { stopScan(); playTrack(t); return; }
          $('scanStatus').textContent = 'That QR isn\u2019t a song card';
        }
      }
    }
  } catch (e) {
    $('scanStatus').innerHTML = '<span class="err">Scan error: ' + e.message + '</span>';
  }
  requestAnimationFrame(tick);
}

// ---------- playback ----------
async function playTrack(t) {
  current = t;
  tint(t.colour);
  show('play');
  $('reveal').style.display = 'none';
  $('prog').style.width = '0';
  $('status').textContent = 'Finding song…';
  try {
    const d = await jsonp('https://itunes.apple.com/lookup?id=' + t.id);
    const r = (d.results || []).find(x => x.wrapperType === 'track');
    if (!r || !r.previewUrl) throw new Error('No preview available for this track');
    current.info = r;
    audio.src = r.previewUrl;
    await audio.play();
    $('status').textContent = 'Playing…';
  } catch (e) {
    $('status').innerHTML = '<span class="err">' + e.message + '</span>';
  }
}
function replay() { if (audio.src) { audio.currentTime = 0; audio.play(); } }
function togglePause() { if (audio.paused) audio.play(); else audio.pause(); }
audio.addEventListener('play', () => { $('pauseBtn').innerHTML = '&#10074;&#10074; Pause'; });
audio.addEventListener('pause', () => { $('pauseBtn').innerHTML = '&#9654; Resume'; });
function toggleReveal() {
  const el = $('reveal');
  if (el.style.display === 'block') { el.style.display = 'none'; return; }
  const i = current && current.info;
  if (!i) return;
  el.innerHTML = (i.artworkUrl100 ? '<img src="' + i.artworkUrl100.replace('100x100', '300x300') + '"><br>' : '') +
    '<b>' + i.trackName + '</b><br>' + i.artistName + '<br>' +
    '<span style="font-size:1.6rem;font-weight:800">' + (current.year || (i.releaseDate || '').slice(0, 4)) + '</span>';
  el.style.display = 'block';
}
audio.addEventListener('timeupdate', () => {
  if (audio.duration) $('prog').style.width = (100 * audio.currentTime / audio.duration) + '%';
});
audio.addEventListener('ended', () => { $('status').textContent = 'Done — replay or scan the next card'; });

// Opened from the phone's own camera app with #t=... : offer a PLAY button (that tap is the gesture)
const fromHash = parseCode(location.search + location.hash);
if (fromHash) {
  current = fromHash;
  tint(fromHash.colour);
  $('startBtn').style.display = 'none';
  $('playBtn').style.display = '';
  $('homeHint').textContent = 'Tap play to hear the mystery song.';
}
function playCurrent() { unlock(); playTrack(current); }
</script>
</body>
</html>
